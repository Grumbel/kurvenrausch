version = 1

# Files that cannot carry a header of their own (prose, generated data, images).
[[annotations]]
path = [".gitignore", "AGENTS.md", "README.md", "TODO.md", "VERSION", "flake.lock", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The icons, generated by tools/make_icons.py from the game's icon.
[[annotations]]
path = ["data/icons/**/*.png", "data/icons/*.ico", "mk/android/app/res/**/*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The Android debug signing key (a keystore cannot carry a header).
[[annotations]]
path = ["mk/android/keystore/debug.keystore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# PortMaster's metadata (JSON has no comments) and screenshot.
[[annotations]]
path = ["mk/r36s/port.json", "mk/r36s/screenshot.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"
